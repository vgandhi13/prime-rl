[project]
name = "glyphbench"
version = "0.1.1"
description = "GlyphBench: A unified benchmark of public text-rendered RL environments for evaluating LLM agents on sequential decision-making"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Roger Creus Castanyer" },
]
keywords = ["reinforcement-learning", "llm", "benchmark", "unicode", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Resolved from prime-rl's editable deps/ copies via the root [tool.uv.sources].
    "verifiers",
    "prime-pydantic-config",
    "datasets>=5.0.1,<6",
    "httpx>=0.27",
    "openai>=1.50",
    "numpy>=2.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "rich>=13.9",
]

[project.scripts]
glyphbench = "glyphbench.cli:main"
gb = "glyphbench.cli:main"

[project.urls]
Homepage = "https://github.com/VmaxAI/glyphbench"
Repository = "https://github.com/VmaxAI/glyphbench"
Issues = "https://github.com/VmaxAI/glyphbench/issues"

[project.optional-dependencies]
# LLM provider clients (pick what you need)
providers = [
    "httpx>=0.27",
    "openai>=1.50",
    "anthropic>=0.40",
    "google-genai>=0.3",
]
# Evaluation CLI for an existing OpenAI-compatible server.
eval-client = [
    "prime>=0.5.77",
]
# Local model inference also needs the GPU runtime.
eval = [
    "glyphbench[eval-client]",
]
# Evaluation result/media tracking (kept optional for lightweight env users).
tracking = [
    "wandb>=0.26.1,<0.27",
    "imageio>=2.37",
    "imageio-ffmpeg>=0.6",
]
# Analysis and plotting
analysis = [
    "pandas>=2.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "ipykernel>=7.2",
]
# Development
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.12",
]
# Generated README/asset GIFs
assets = [
    "huggingface-hub>=0.25",
    "Pillow>=12.3.0",
]
# Non-GPU convenience extras
all = [
    "glyphbench[providers,analysis,dev,assets]",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glyphbench"]

[tool.hatch.build.targets.sdist]
# Ship project sources, not optional submodule checkouts or local run artifacts.
include = [
    "/src", "/tests", "/docs", "/examples", "/configs", "/eval", "/scripts",
    "/notebooks/return_violins.ipynb", "/README.md", "/CONTRIBUTING.md",
    "/LICENSE", "/pyproject.toml", "/uv.lock", "/pricing.yaml",
    "/.python-version", "/.env.example", "/Dockerfile", "/.dockerignore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
files = [
    "src/glyphbench/core",
    "src/glyphbench/protocol.py",
    "src/glyphbench/termination.py",
]

[[tool.mypy.overrides]]
module = [
    "yaml",
    "pandas",
    "google",
    "google.genai",
    "google.genai.*",
    "vllm",
    "vllm.*",
    "verifiers",
    "verifiers.*",
    "datasets",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "huggingface-hub>=1.11.0",
]
